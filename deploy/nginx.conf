# www → apex (www DNS A/CNAME шаардлагатай; dns-request-email.md)
server {
    listen 80;
    server_name www.manage.dornogovi.gov.mn;
    return 301 https://manage.dornogovi.gov.mn$request_uri;
}

server {
    listen 80;
    server_name manage.dornogovi.gov.mn;
    root /var/www/manage.dornogovi.gov.mn/public;

    index index.php;
    charset utf-8;

    # --- Аюулгүй байдлын толгойнууд (интернэтэд ил гарсан үед чухал) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS — includeSubDomains нь www DNS бэлэн болсны дараа л (go-public.sh)
    add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Session cookie Secure / CSRF — PHP хүсэлтийг HTTPS гэж зөв мэдэгдэнэ.
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    # .env, .git зэрэг нуугдмал файлууд (certbot-ийн .well-known-ээс бусад)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 32M;
}
