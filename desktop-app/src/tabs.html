<!doctype html>
<html lang="mn">
<head>
    <meta charset="utf-8">
    <title>Табууд</title>
    <style>
        :root {
            --navy-600: #1c55a5;
            --navy-700: #164789;
            --navy-800: #153b70;
            --navy-900: #15335d;
            --navy-300: #93b9e0;
            --navy-100: #e4eef8;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
            background: linear-gradient(180deg, var(--navy-700) 0%, var(--navy-800) 100%);
            font: 13px/1.2 "Segoe UI", system-ui, sans-serif;
            color: #fff;
            user-select: none;
            /* Цонхны толгой нь энэ мөр — эндээс чирнэ. */
            -webkit-app-region: drag;
            /* Баруун талд Windows-ийн багасгах/хаах товчнууд. */
            padding-right: 146px;
        }

        button, .tab { -webkit-app-region: no-drag; }

        .nav {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .nav button {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--navy-300);
            font-size: 15px;
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        .nav button:hover:not(:disabled) {
            background: rgba(255, 255, 255, .14);
            color: #fff;
        }

        .nav button:disabled { opacity: .3; cursor: default; }

        #tabs {
            display: flex;
            align-items: center;
            gap: 4px;
            overflow: hidden;
            flex: 1;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            max-width: 230px;
            flex: 0 1 auto;
            height: 30px;
            padding: 0 6px 0 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .08);
            color: var(--navy-100);
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        .tab:hover { background: rgba(255, 255, 255, .18); }

        .tab.active {
            background: #fff;
            color: var(--navy-800);
            font-weight: 600;
            box-shadow: 0 1px 6px rgba(0, 0, 0, .18);
        }

        .tab .label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tab .close {
            flex: none;
            width: 19px;
            height: 19px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: inherit;
            font-size: 14px;
            line-height: 1;
            opacity: .65;
            cursor: pointer;
        }

        .tab .close:hover {
            background: rgba(0, 0, 0, .12);
            opacity: 1;
        }

        .tab.active .close:hover { background: var(--navy-100); }

        .icon {
            flex: none;
            width: 16px;
            height: 16px;
            object-fit: contain;
            border-radius: 3px;
        }

        .dot {
            flex: none;
            width: 7px;
            height: 7px;
            margin: 0 4px;
            border-radius: 50%;
            background: currentColor;
            opacity: .45;
        }

        .tab.active .dot {
            background: var(--navy-600);
            opacity: 1;
        }

        .version {
            flex: none;
            padding: 4px 11px;
            border: 1px solid rgba(255, 255, 255, .25);
            border-radius: 999px;
            background: transparent;
            color: var(--navy-300);
            font-size: 11px;
            letter-spacing: .02em;
            cursor: pointer;
            transition: background .15s, color .15s, border-color .15s;
        }

        .version:hover {
            background: rgba(255, 255, 255, .14);
            border-color: transparent;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="nav">
        <button id="back" title="Буцах" disabled>&#8592;</button>
        <button id="reload" title="Дахин ачаалах">&#10227;</button>
    </div>

    <div id="tabs"></div>

    <button id="update" class="version" title="Шинэчлэлт шалгах"></button>

    <script>
        const list = document.getElementById('tabs');
        const back = document.getElementById('back');
        const update = document.getElementById('update');

        window.mdTabs.version().then((version) => {
            update.textContent = `v${version}`;
        });

        update.addEventListener('click', () => window.mdTabs.checkUpdates());

        back.addEventListener('click', () => window.mdTabs.back());
        document.getElementById('reload').addEventListener('click', () => window.mdTabs.reload());

        window.mdTabs.onState((state) => {
            back.disabled = ! state.canGoBack;
            list.replaceChildren(...state.tabs.map(build));
        });

        function build(tab) {
            const node = document.createElement('div');

            node.className = tab.active ? 'tab active' : 'tab';
            node.title = tab.title;
            node.addEventListener('click', () => window.mdTabs.activate(tab.id));

            const mark = tab.icon ? document.createElement('img') : document.createElement('span');

            if (tab.icon) {
                mark.className = 'icon';
                mark.src = tab.icon;
                mark.alt = '';
                // Татагдаагүй бол цэг болгоно.
                mark.addEventListener('error', () => {
                    mark.replaceWith(Object.assign(document.createElement('span'), { className: 'dot' }));
                });
            } else {
                mark.className = 'dot';
            }

            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = tab.title;

            node.append(mark, label);

            if (tab.closable) {
                const close = document.createElement('button');

                close.className = 'close';
                close.textContent = '×';
                close.title = 'Таб хаах';
                close.addEventListener('click', (event) => {
                    event.stopPropagation();
                    window.mdTabs.close(tab.id);
                });

                node.append(close);
            }

            return node;
        }
    </script>
</body>
</html>
